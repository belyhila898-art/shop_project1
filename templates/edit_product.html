{% extends 'base.html' %}

{% block content %}
<h2>Редактировать товар</h2>

<form method="POST" style="max-width:500px; display:grid; grid-template-columns:1fr 1fr; gap:12px;">
  <div class="form-group">
    <label>Название</label>
    <input type="text" name="name" value="{{ product.name }}" required>
  </div>
  <div class="form-group">
    <label>Категория</label>
    <select name="category" required>
      <option value="electronics" {% if product.category == 'electronics' %}selected{% endif %}>Электроника</option>
      <option value="clothing" {% if product.category == 'clothing' %}selected{% endif %}>Одежда</option>
      <option value="furniture" {% if product.category == 'furniture' %}selected{% endif %}>Мебель</option>
    </select>
  </div>
  <div class="form-group" style="grid-column:1/-1;">
    <label>Описание</label>
    <textarea name="desc" rows="3" required>{{ product.description }}</textarea>
  </div>
  <div class="form-group">
    <label>Цена</label>
    <input type="number" name="price" value="{{ product.price }}" required>
  </div>
  <div class="form-group">
    <label>Скидка</label>
    <input type="number" name="discount" value="{{ product.discount }}">
  </div>
  <div class="form-group" style="grid-column:1/-1;">
    <label>Ссылка на фото</label>
    <input type="url" name="img" value="{{ product.image_url }}" placeholder="https://...">
  </div>
  <div style="grid-column:1/-1; display:flex; gap:12px;">
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="{{ url_for('dashboard_admin' if session.role == 'admin' else 'dashboard_manager') }}" class="btn btn-outline">Отмена</a>
  </div>
</form>
{% endblock %}
