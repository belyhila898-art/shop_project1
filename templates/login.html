{% extends 'base.html' %}

{% block content %}
<div style="max-width:400px; margin:0 auto;">
  <h2>Вход в магазин</h2>
  {% if error %}
    <div style="padding:1rem; background:#fee2e2; color:#b91c1c; border-radius:8px; margin-bottom:1rem;">{{ error }}</div>
  {% endif %}
  <form method="POST">
    <div class="form-group">
      <label>Логин</label>
      <input type="text" name="username" required placeholder="admin / user / manager">
    </div>
    <div class="form-group">
      <label>Пароль</label>
      <input type="password" name="password" required placeholder="admin123 / user123 / manager123">
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%;">Войти</button>
  </form>
</div>
{% endblock %}
